name: Contrôles

on:
  push:
    branches: [main]
  pull_request:
  # Une vulnérabilité peut apparaître dans une dépendance SANS qu'on touche au
  # code : l'audit doit donc tourner aussi sur un rythme régulier.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  qualite:
    name: Qualité du code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Style, imports et pièges courants
        run: ruff check --output-format=github .
      - name: Formatage
        run: ruff format --check .

  securite:
    name: Sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Motifs dangereux (bandit)
        run: bandit -c pyproject.toml -r netbox_applications
      - name: Vulnérabilités des dépendances (pip-audit)
        run: pip-audit --strict
      - name: Secrets commités (detect-secrets)
        run: |
          detect-secrets scan --baseline .secrets.baseline
          detect-secrets audit --report --fail-on-unaudited .secrets.baseline

  construction:
    name: Construction du paquet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      # twine check attrape les métadonnées invalides AVANT publication —
      # un paquet refusé par PyPI après coup est bien plus pénible.
      - run: twine check dist/*

  integration:
    name: Chargement réel dans NetBox
    runs-on: ubuntu-latest
    # C'est le contrôle qui compte : un plugin qui passe le lint mais ne se
    # charge pas dans NetBox n'a aucune valeur.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: valkey/valkey:9.1-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v5
      - name: Construire une image NetBox avec le plugin
        run: |
          cat > Dockerfile.test <<'DOCKER'
          FROM netboxcommunity/netbox:v4.7-5.1.1
          USER root
          COPY . /plugin/
          RUN uv pip install --no-cache /plugin/
          RUN printf 'PLUGINS = ["netbox_applications"]\n' > /etc/netbox/config/extra.py
          USER 999
          DOCKER
          docker build -f Dockerfile.test -t netbox-plugin-test .
      - name: Vérifier que le plugin se charge et que les migrations passent
        run: |
          docker run --rm --network host \
            -e DB_HOST=localhost -e DB_NAME=netbox -e DB_USER=netbox -e DB_PASSWORD=netbox \
            -e REDIS_HOST=localhost -e REDIS_PASSWORD= \
            -e SECRET_KEY=cle-de-test-suffisamment-longue-pour-netbox-0123456789 \
            netbox-plugin-test \
            /opt/netbox/netbox/manage.py migrate

      # Un ColorField n'accepte que six caractères hexadécimaux. Une migration
      # de données n'appelle pas full_clean() : écrire « red » y passait sans
      # erreur et produisait un badge sans couleur. Seul ce contrôle le voit.
      - name: Vérifier que toutes les couleurs sont valides
        run: |
          docker run --rm --network host \
            -e DB_HOST=localhost -e DB_NAME=netbox -e DB_USER=netbox -e DB_PASSWORD=netbox \
            -e REDIS_HOST=localhost -e REDIS_PASSWORD= \
            -e SECRET_KEY=cle-de-test-suffisamment-longue-pour-netbox-0123456789 \
            netbox-plugin-test \
            /opt/netbox/netbox/manage.py shell -c "
          import re
          from netbox_applications.models import REFERENCES

          HEXA = re.compile(r'^[0-9a-f]{6}\$')
          echecs, n = [], 0
          for modele in REFERENCES:
              for objet in modele.objects.all():
                  n += 1
                  if not HEXA.match(objet.color or ''):
                      echecs.append(f'{modele.__name__} / {objet.slug} : {objet.color!r}')
          if not n:
              raise SystemExit('ECHEC : aucune valeur de référentiel, la migration n a rien créé.')
          if echecs:
              raise SystemExit('ECHEC — couleurs invalides\n' + '\n'.join(echecs))
          print(f'{n} valeurs, toutes avec une couleur valide.')
          "

      # Un garde-fou non éprouvé n'en est pas un : celui de l'exposition
      # externe comparait un objet à une chaîne depuis la 0.4.0 et n'a rien
      # refusé pendant deux versions, sans que rien ne le signale.
      - name: Éprouver les garde-fous du modèle
        run: |
          docker run --rm --network host \
            -e DB_HOST=localhost -e DB_NAME=netbox -e DB_USER=netbox -e DB_PASSWORD=netbox \
            -e REDIS_HOST=localhost -e REDIS_PASSWORD= \
            -e SECRET_KEY=cle-de-test-suffisamment-longue-pour-netbox-0123456789 \
            netbox-plugin-test \
            /opt/netbox/netbox/manage.py shell -c "
          from django.core.exceptions import ValidationError
          from netbox_applications.models import (
              Application, Deployment, DataClassification, DeploymentStatus,
              Environment, LifecycleStatus,
          )

          retire = LifecycleStatus.objects.get(slug='retire')
          en_service = LifecycleStatus.objects.get(slug='en-service')
          actif = DeploymentStatus.objects.get(slug='actif')
          prod = Environment.objects.get(slug='production')
          recette = Environment.objects.get(slug='recette')

          app = Application.objects.create(name='ci-app', lifecycle_status=en_service)
          d_prod = Deployment.objects.create(application=app, environment=prod, status=actif)

          echecs = []

          def refuse(objet, cas, champ):
              try:
                  objet.full_clean()
              except ValidationError as e:
                  if champ not in e.message_dict:
                      echecs.append(f'{cas} : refusé mais sur {list(e.message_dict)}')
              else:
                  echecs.append(f'{cas} : ACCEPTÉ alors qu il devait être refusé')

          def accepte(objet, cas):
              try:
                  objet.full_clean()
              except ValidationError as e:
                  echecs.append(f'{cas} : refusé à tort ({e.message_dict})')

          # Cohérence entre les deux niveaux, dans les deux sens.
          app.lifecycle_status = retire
          refuse(app, 'retirer le service avec une prod en fonctionnement', 'lifecycle_status')
          Application.objects.filter(pk=app.pk).update(lifecycle_status=retire)
          d_prod.refresh_from_db()
          refuse(d_prod, 'prod en fonctionnement pour un service retiré', 'status')

          # Hors production, aucune contrainte.
          d_rec = Deployment.objects.create(application=app, environment=recette, status=actif)
          accepte(d_rec, 'recette en fonctionnement pour un service retiré')

          # Exposition externe d une donnée restreinte.
          Application.objects.filter(pk=app.pk).update(
              lifecycle_status=en_service,
              data_classification=DataClassification.objects.get(slug='restreint'),
          )
          d_rec.refresh_from_db(); d_rec.external_facing = True
          refuse(d_rec, 'exposition externe d une donnée restreinte', 'external_facing')

          Application.objects.filter(pk=app.pk).update(
              data_classification=DataClassification.objects.get(slug='interne'),
          )
          d_rec.refresh_from_db(); d_rec.external_facing = True
          accepte(d_rec, 'exposition externe d une donnée interne')

          if echecs:
              raise SystemExit('ECHEC\n' + '\n'.join(echecs))
          print('Garde-fous éprouvés : 5 cas, tous conformes.')
          "

      # C'EST LE CONTRÔLE QUI COMPTE. Rendre un gabarit isolément ne prouve
      # rien : la version 0.4.0 avait dix pages en erreur 500 alors que ses
      # gabarits se rendaient. On parcourt donc TOUTES les pages du plugin
      # comme le ferait un navigateur, vues et routage compris.
      - name: Parcourir toutes les pages du plugin
        run: |
          docker run --rm --network host \
            -e DB_HOST=localhost -e DB_NAME=netbox -e DB_USER=netbox -e DB_PASSWORD=netbox \
            -e REDIS_HOST=localhost -e REDIS_PASSWORD= \
            -e SECRET_KEY=cle-de-test-suffisamment-longue-pour-netbox-0123456789 \
            netbox-plugin-test \
            /opt/netbox/netbox/manage.py shell -c "
          from django.test import Client
          from django.urls import reverse
          from django.contrib.auth import get_user_model
          from netbox_applications.models import (
              Application, Deployment, REFERENCES, Environment,
          )

          U = get_user_model()
          user = U.objects.create_superuser('ci', 'ci@example.invalid', 'x')

          # Une valeur dans chaque référentiel : une page de fiche ne se teste
          # pas sans objet à afficher.
          for modele in REFERENCES:
              modele.objects.create(name='ci', slug='ci')
          app = Application.objects.create(name='ci-app')
          Deployment.objects.create(application=app, environment=Environment.objects.first())

          c = Client(raise_request_exception=False)
          c.force_login(user)

          pages = []
          for modele in (*REFERENCES, Application, Deployment):
              nom = modele._meta.model_name
              pages.append(reverse(f'plugins:netbox_applications:{nom}_list'))
              pages.append(reverse(f'plugins:netbox_applications:{nom}_add'))
              objet = modele.objects.first()
              pages.append(objet.get_absolute_url())
              pages.append(objet.get_absolute_url() + 'edit/')

          PARASITES = ('functools.partial', '{#', '#}', '{{', '{%')
          echecs = []
          for url in pages:
              r = c.get(url)
              if r.status_code not in (200, 302):
                  echecs.append(f'{url} -> HTTP {r.status_code}')
                  continue
              if r.status_code == 200:
                  html = r.content.decode()
                  for motif in PARASITES:
                      if motif in html:
                          echecs.append(f'{url} : « {motif} » présent dans le rendu')
          if echecs:
              raise SystemExit('ECHEC\n' + '\n'.join(echecs))
          print(f'{len(pages)} pages parcourues, toutes rendues sans texte parasite.')
          "
