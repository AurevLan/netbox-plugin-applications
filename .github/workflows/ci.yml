name: Contrôles

# Les actions sont épinglées par EMPREINTE de commit, pas par étiquette. Une
# étiquette « v5 » peut être redéplacée par son auteur — ou par quiconque prend
# le contrôle de son dépôt — vers un commit quelconque, qui s'exécuterait ici
# avec nos droits. L'empreinte, elle, ne peut pas changer de contenu.
# Le commentaire à droite dit quelle version l'empreinte représente ; Dependabot
# met les deux à jour ensemble.

on:
  push:
    branches: [main]
  pull_request:
  # Une vulnérabilité peut apparaître dans une dépendance SANS qu'on touche au
  # code : l'audit doit donc tourner aussi sur un rythme régulier.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  qualite:
    name: Qualité du code (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # NetBox 4.7 s'exécute sur Python 3.14. Ne qualifier que sur 3.12 revenait
    # à valider une version que personne n'exécute.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Style, imports et pièges courants
        run: ruff check --output-format=github .
      - name: Formatage
        run: ruff format --check .

  securite:
    name: Sécurité
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Motifs dangereux (bandit)
        run: bandit -c pyproject.toml -r netbox_applications
      - name: Vulnérabilités des dépendances (pip-audit)
        # « --skip-editable » : le plugin s'installe en mode éditable pour être
        # audité, et n'étant pas publié sur PyPI il ne peut pas s'y résoudre.
        # « --strict » transformait cette non-résolution en échec — le contrôle
        # échouait donc sur lui-même, jamais sur une vulnérabilité.
        # Sans « --strict », une vulnérabilité réelle fait toujours échouer.
        run: pip-audit --skip-editable
      - name: Secrets commités (detect-secrets)
        # « --fail-on-unaudited » n'existe pas dans detect-secrets : l'étape
        # échouait sur un argument inconnu, donc à chaque exécution, sans
        # jamais rien contrôler. Le contrôle est ici écrit avec ce que l'outil
        # offre réellement.
        run: |
          set -euo pipefail
          detect-secrets scan --baseline .secrets.baseline
          python - <<'CONTROLE'
          import json
          import subprocess
          import sys

          # « generated_at » change à chaque exécution : seul « results » compte.
          reference = json.loads(subprocess.check_output(['git', 'show', 'HEAD:.secrets.baseline']))
          courant = json.load(open('.secrets.baseline'))

          if reference['results'] != courant['results']:
              print('ECHEC : la détection ne correspond plus à la référence versionnée.')
              print('Un secret potentiel est apparu, ou une ligne référencée a bougé.')
              print('Relire, puis committer la nouvelle référence :')
              print('    detect-secrets scan --baseline .secrets.baseline')
              sys.exit(1)

          reels = [
              f"{fichier}:{entree['line_number']} ({entree['type']})"
              for fichier, entrees in courant['results'].items()
              for entree in entrees
              if entree.get('is_secret') is True
          ]
          if reels:
              print('ECHEC : des secrets AVÉRÉS figurent dans la référence :')
              print('\n'.join(f'  {r}' for r in reels))
              sys.exit(1)

          total = sum(len(e) for e in courant['results'].values())
          print(f'{total} détections, toutes connues et tenues pour des faux positifs.')
          CONTROLE

  construction:
    name: Construction du paquet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      # twine check attrape les métadonnées invalides AVANT publication —
      # un paquet refusé par PyPI après coup est bien plus pénible.
      - run: twine check dist/*

  integration:
    name: Chargement réel dans NetBox
    runs-on: ubuntu-latest
    # C'est le contrôle qui compte : un plugin qui passe le lint mais ne se
    # charge pas dans NetBox n'a aucune valeur.
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: valkey/valkey:9.1-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Construire une image NetBox avec le plugin
        run: |
          cat > Dockerfile.test <<'DOCKER'
          FROM netboxcommunity/netbox:v4.7-5.1.1
          USER root
          COPY . /plugin/
          # « coverage » mesure ce que la suite de tests atteint réellement.
          RUN uv pip install --no-cache /plugin/ coverage==7.6.10
          RUN printf 'PLUGINS = ["netbox_applications"]\n' > /etc/netbox/config/extra.py
          USER 999
          DOCKER
          docker build -f Dockerfile.test -t netbox-plugin-test .

      - name: Vérifier que le plugin se charge et que les migrations passent
        run: |
          docker run --rm --network host \
            -e DB_HOST=localhost -e DB_NAME=netbox -e DB_USER=netbox -e DB_PASSWORD=netbox \
            -e REDIS_HOST=localhost -e REDIS_PASSWORD= \
            -e SECRET_KEY=cle-de-test-suffisamment-longue-pour-netbox-0123456789 \
            netbox-plugin-test \
            /opt/netbox/netbox/manage.py migrate

      # LA SUITE DE TESTS. Elle a remplacé quatre étapes de script noyées dans
      # ce fichier : des contrôles écrits en YAML ne sont ni versionnés comme du
      # code, ni exécutables localement, ni mesurables — et trois d'entre eux ont
      # échoué pendant des mois sans que personne le voie.
      #
      # « --fail-under » : une couverture qui baisse doit faire échouer la
      # construction, sinon elle baisse.
      - name: Tests et couverture
        run: |
          docker run --rm --network host \
            -e DB_HOST=localhost -e DB_NAME=netbox -e DB_USER=netbox -e DB_PASSWORD=netbox \
            -e REDIS_HOST=localhost -e REDIS_PASSWORD= \
            -e SECRET_KEY=cle-de-test-suffisamment-longue-pour-netbox-0123456789 \
            netbox-plugin-test sh -c '
              coverage run --source=netbox_applications --omit="*/migrations/*,*/tests/*" \
                /opt/netbox/netbox/manage.py test netbox_applications --verbosity 2 &&
              coverage report --precision=1 --fail-under=95
            '
