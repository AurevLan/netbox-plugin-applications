name: Publication

# Déclenchée par la POSE D'UN TAG, jamais par un envoi sur « main » : une
# version se publie quand on décide qu'elle existe, pas à chaque correction.
#
# Les actions sont épinglées par empreinte de commit, comme dans « Contrôles ».
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  construire:
    name: Construire le paquet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      # La version du paquet doit être celle du tag. Sans ce contrôle, on
      # publierait une 0.11.0 sous l'étiquette v0.12.0 — et personne ne s'en
      # apercevrait avant d'essayer de l'installer.
      - name: Le tag et la version du paquet concordent-ils ?
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          paquet="$(python -c "
          import tomllib
          print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])
          ")"
          if [ "$tag" != "$paquet" ]; then
            echo "ECHEC : tag v$tag, mais pyproject.toml déclare $paquet." >&2
            exit 1
          fi
          echo "Tag et paquet concordent : $paquet"

      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: paquet
          path: dist/

  publier-github:
    name: Publier la release GitHub
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      # Créer une release écrit dans le dépôt : c'est le seul droit élargi ici.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: paquet
          path: dist/

      - name: Extraire les notes du CHANGELOG
        run: python .github/scripts/notes_de_version.py "${GITHUB_REF_NAME}" > notes.md

      # « gh » est préinstallé sur les exécuteurs : aucune action tierce, donc
      # aucune surface d'attaque ajoutée pour créer une release.
      #
      # La ROUE EST ATTACHÉE à la release, et c'est le point : elle devient
      # téléchargeable publiquement et durablement, là où un artefact de CI
      # expire et exige un compte. C'est ce qu'emporte quelqu'un qui installe
      # le plugin sur un réseau fermé.
      - name: Créer la release avec la roue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            dist/*

  publier-pypi:
    name: Publier sur PyPI
    needs: construire
    runs-on: ubuntu-latest
    # Le garde-fou est posé sur l'ÉTAPE, pas sur le job. Une condition de job
    # est évaluée AVANT le démarrage, donc avant le chargement de
    # l'environnement « pypi » : une variable définie sur cet environnement y
    # serait invisible, et la tâche resterait sautée sans qu'on comprenne
    # pourquoi. Au niveau de l'étape, la variable est lue qu'elle soit posée
    # sur le dépôt OU sur l'environnement.
    #
    # Pour activer : une variable PUBLIER_SUR_PYPI = oui, au choix dans
    # Settings → Secrets and variables → Actions → Variables (dépôt),
    # ou sur l'environnement « pypi » lui-même.
    # « Trusted publishing » : PyPI reconnaît ce dépôt, ce workflow et cet
    # environnement, et délivre un jeton éphémère. AUCUN SECRET n'est stocké
    # ici — rien à faire fuiter, rien à faire tourner.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: paquet
          path: dist/
      # Dire à voix haute ce qui va se passer : une étape sautée sans
      # explication se lit comme une panne.
      - name: État du garde-fou
        run: |
          if [ "${{ vars.PUBLIER_SUR_PYPI }}" = "oui" ]; then
            echo "PUBLIER_SUR_PYPI=oui — publication sur PyPI."
          else
            echo "PUBLIER_SUR_PYPI absente ou différente de « oui »."
            echo "Valeur lue : « ${{ vars.PUBLIER_SUR_PYPI }} »"
            echo "Publication PyPI ignorée. Voir CONTRIBUTING.md § Activer la publication PyPI."
          fi

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        if: vars.PUBLIER_SUR_PYPI == 'oui'
