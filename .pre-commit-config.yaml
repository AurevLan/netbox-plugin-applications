# Contrôles exécutés AVANT chaque commit.
#
# Le principe : ce qui est refusé en intégration continue doit l'être ici,
# sinon on découvre l'échec après avoir poussé.
#
#   pre-commit install
default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
      # Empêche de committer directement sur main : une revue reste possible.
      - id: no-commit-to-branch
        args: ["--branch", "main"]
      # Une clé privée commitée est irrécupérable : l'historique la conserve.
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.2
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.6
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests/|netbox_applications/migrations/)

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        exclude: ^\.secrets\.baseline$
